name: Navigator examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:
  acceptance:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run standalone example acceptance
        run: bun run examples:acceptance

  synchronize:
    concurrency:
      cancel-in-progress: false
      group: navigator-example-synchronization
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Create the scoped synchronization token
        id: synchronization-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.synchronization-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize published artifacts
        run: bun run release:synchronize

      - name: Commit synchronized artifacts
        run: |
          if git diff --quiet -- README.md examples paradox; then
            echo "Published Navigator artifacts are already current."
            exit 0
          fi

          version="$(node -p "require('./package.json').version")"
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add README.md examples paradox
          git commit -m "chore(release): synchronize @ankhorage/navigator@$version artifacts"
          git push origin HEAD:main
