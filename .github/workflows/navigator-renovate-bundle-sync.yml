name: Navigator Renovate Bundle Sync

on:
  push:
    branches:
      - renovate/ankhorage-libraries

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: renovate/ankhorage-libraries
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run examples:synchronize
      - name: Commit generated dependency state
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock examples
          git commit -m "fix(deps): synchronize Ankhorage library bundle"
          git push origin HEAD:renovate/ankhorage-libraries
